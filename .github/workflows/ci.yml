name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-secret-key-0123456789
      DATABASE_URL: postgresql://user:password@localhost:5432/gearup_test
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests (Testcontainers)
        env:
          RUN_INTEGRATION_TESTS: 'true'
        run: npx vitest run src/modules/auth/__tests__/auth.integration.test.ts

      - name: Build
        run: npm run build
